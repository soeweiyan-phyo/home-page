# Production stack. Dashboard on 7050; runs beside Homepage (:3000) until the
# cutover.
#
#   pnpm prod        # docker compose up -d --build
#
# config/dashboard.yaml and config/icons/ belong to this host: gitignored and
# mounted read-only. Restart the container after editing them.
services:
    app:
        build: .
        image: home-page
        container_name: home-page
        restart: unless-stopped
        ports:
            - '7050:7050'
        environment:
            TZ: Australia/Melbourne
            DOCKER_URL: http://socket-proxy:2375
            RESTART_URL: http://restart-proxy:2375
        depends_on:
            - socket-proxy
            - restart-proxy
        volumes:
            # Long syntax, so a missing source fails the start instead of
            # Docker creating an empty directory in its place.
            - type: bind
              source: ./config/dashboard.yaml
              target: /app/config/dashboard.yaml
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ./config/icons
              target: /app/config/icons
              read_only: true
              bind:
                  create_host_path: false
            # One per disk in dashboard.yaml, at the same path, for statfs.
            # / needs none: the container's overlay sits on the host's root
            # disk.
            - /mnt/adata:/mnt/adata:ro
            - /mnt/s-power:/mnt/s-power:ro
            - /mnt/passport:/mnt/passport:ro

    # The app never holds docker.sock: anything that can reach the socket can
    # start, stop or create containers, which is root on the host. This proxy
    # passes GET only (POST defaults to 0).
    socket-proxy:
        image: tecnativa/docker-socket-proxy:v0.5.0
        container_name: home-page-socket-proxy
        restart: unless-stopped
        environment:
            TZ: Australia/Melbourne
            CONTAINERS: 1
            # On by default and unused here.
            EVENTS: 0
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        # Loopback only, for `pnpm dev`. Never 0.0.0.0: GET on /containers/*
        # also returns every container's environment, secrets included.
        ports:
            - '127.0.0.1:7052:2375'

    # Restarts only. The read proxy cannot do this: its POST=1 would let
    # CONTAINERS=1 pass any write under /containers, create and exec included.
    # Here CONTAINERS stays 0, so the one write rule that matches is
    # ALLOW_RESTARTS: restart, stop and kill of a single container.
    restart-proxy:
        image: tecnativa/docker-socket-proxy:v0.5.0
        container_name: home-page-restart-proxy
        restart: unless-stopped
        environment:
            TZ: Australia/Melbourne
            POST: 1
            ALLOW_RESTARTS: 1
            # On by default and unused here.
            EVENTS: 0
            PING: 0
            VERSION: 0
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        # Loopback only, for `pnpm dev`. It restarts any container, not just
        # the dashboard's; the app's allowlist is what narrows it.
        ports:
            - '127.0.0.1:7054:2375'
