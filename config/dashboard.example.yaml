# Copy to config/dashboard.yaml, and put custom icons in config/icons/. Both are
# gitignored: the real config names internal hosts and ports. Compose mounts
# them read-only into the container; restart the container after editing.
#
# icon: a dashboard-icons file name (jellyfin.png), a file in config/icons
#   (/icons/film.png), or a Material Design glyph (mdi-robot).
# container: the Docker container whose state draws the card's status dot.
# Every service field but name is optional.

greeting: HOME

# Mount points whose usage the header shows. Each one other than / must also be
# mounted into the container in docker-compose.yaml, or it reports the
# container's own root disk instead.
disks:
    - /
    - /mnt/media

groups:
    - name: Media
      services:
          - name: Jellyfin
            icon: jellyfin.png
            href: http://server.local:8096
            description: Media server
            container: jellyfin
          - name: My App
            icon: /icons/film.png
            href: http://server.local:7000
            container: my-app

    - name: Planned
      collapsed: true
      services:
          - name: Assistant
            icon: mdi-robot
            description: Not built yet
